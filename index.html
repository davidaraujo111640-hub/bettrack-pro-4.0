<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#050505">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BettrackAPP">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/1055/1055644.png">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1055/1055644.png">
    <!-- iOS Splash Screen -->
    <link rel="apple-touch-startup-image" href="https://cdn-icons-png.flaticon.com/512/1055/1055644.png">
    <link rel="manifest" href="/manifest.json">
    <title>BettrackAPP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #050505;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(226, 0, 26, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(226, 0, 26, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(226, 0, 26, 0.02) 0%, transparent 60%);
            background-attachment: fixed;
            color: #ffffff;
            margin: 0;
            overflow-x: hidden;
            min-height: 100vh;
        }
        .glass-panel {
            background: rgba(18, 18, 18, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        /* Ocultar scrollbar */
        ::-webkit-scrollbar { width: 0px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        @keyframes slideInUp {
            from { transform: translateY(10px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .animate-slide-up {
            animation: slideInUp 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        /* Mobile safe area utilities */
        .safe-area-pb {
            padding-bottom: env(safe-area-inset-bottom, 12px);
        }
        
        @media (max-width: 640px) {
            .glass-panel {
                backdrop-filter: blur(10px); /* Reduce blur on mobile for performance */
            }
            h2 {
                letter-spacing: -0.02em;
            }
        }

        /* Smooth scrolling for mobile */
        html {
            scroll-behavior: smooth;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
